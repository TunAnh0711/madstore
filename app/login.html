<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — MadStore</title>
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<header data-header></header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Đăng nhập</h1>
    <p class="auth-card__sub">Dùng ví, theo dõi đơn và nhận hàng ngay trong tài khoản.</p>

    <form class="auth-form" data-auth-form data-mode="login" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="ban@example.com" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Tối thiểu 6 ký tự" required>
      </div>
      <div class="form-error" data-error></div>
      <button class="btn btn--primary btn--lg btn--block" type="submit" data-submit>Đăng nhập</button>
    </form>

    <p class="auth-switch">Chưa có tài khoản? <a href="/register">Tạo tài khoản</a></p>

    <div class="hint-box" style="margin-top:1.25rem">
      <span>Tài khoản dùng thử: <span class="mono">demo@madstore.vn</span> · mật khẩu <span class="mono">123456</span> — ví đã có sẵn 500.000 VNĐ.</span>
    </div>
  </div>
</main>

<footer data-footer></footer>

<script src="/assets/js/core.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
